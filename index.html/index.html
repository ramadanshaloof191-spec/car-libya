<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كار ليبيا | سوق السيارات الليبي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0b;--panel:#121416;--gold:#d9ad53;--gold2:#f4d58a;--text:#f7f4ed;--muted:#a6a6a6;--line:rgba(255,255,255,.09);--green:#25d366}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;line-height:1.7}
.wrap{width:min(1180px,92%);margin:auto}.topbar{position:sticky;top:0;z-index:20;background:rgba(9,10,11,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand-mark{width:52px;height:52px;border-radius:50%;overflow:hidden;border:1px solid var(--gold);background:#000;display:grid;place-items:center}
.brand-mark img{width:100%;height:100%;object-fit:cover}.brand-name{font-size:21px}.brand-name small{display:block;color:var(--gold);font-size:11px}
.navlinks{display:flex;gap:25px;color:#d1d1d1}.nav-cta,.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17130b;padding:11px 18px;border-radius:12px;font-weight:800}
.hero-card{min-height:440px;border-radius:28px;overflow:hidden;position:relative;display:flex;align-items:center;background:#151719;margin:32px 0;border:1px solid #ffffff15}
.hero-photo{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,10,.98),rgba(8,9,10,.36)),url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=2000&q=85');background-size:cover}
.hero-content{position:relative;z-index:1;max-width:620px;padding:55px 6.5%}h1{font-size:clamp(34px,5vw,58px);line-height:1.2;margin:18px 0}h1 span{color:var(--gold2)}
.search-panel{background:#17191b;border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.control{width:100%;min-height:48px;background:#0b0c0d;border:1px solid #ffffff16;color:white;border-radius:11px;padding:10px 13px}
.cars-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.car-card{background:#17191b;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.car-card.featured{border-color:#d9ad53a0;box-shadow:0 0 25px #d9ad5325}.car-photo{height:220px;background:#202326;position:relative;cursor:pointer}
.car-photo img{width:100%;height:100%;object-fit:cover}.photo-count{position:absolute;top:12px;right:12px;background:#000b;color:#fff;padding:5px 9px;border-radius:8px;font-size:11px}
.fav-btn{position:absolute;top:12px;left:12px;background:#000a;border:1px solid #fff3;color:white;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.fav-btn.active{color:#ff4d6d;border-color:#ff4d6d}.status-pill{position:absolute;left:50px;top:12px;background:var(--gold);color:#000;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:800}
.car-body{padding:16px}.car-price{font-size:26px;font-weight:900;color:var(--gold2);margin:10px 0}.city-badge{position:absolute;bottom:12px;right:12px;background:#000d;color:var(--gold2);padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid #d9ad5340}
.whatsapp-float{position:fixed;bottom:22px;left:22px;z-index:60;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);display:grid;place-items:center;color:white;font-size:28px;box-shadow:0 8px 25px #25d36660;animation:pulse 2s infinite;text-decoration:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #25d36680}70%{box-shadow:0 0 0 15px #25d36600}100%{box-shadow:0 0 0 0 #25d36600}}
@media(max-width:900px){.search-panel{grid-template-columns:1fr 1fr}.cars-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.search-panel{grid-template-columns:1fr}.cars-grid{grid-template-columns:1fr}.navlinks{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap nav"><a class="brand" href="#"><span class="brand-mark"><img src="logo.png" alt="logo" onerror="this.parentElement.innerHTML='🚗'"></span><span class="brand-name">CAR LIBYA<small>سوق السيارات الليبي</small></span></a><nav class="navlinks"><a href="#cars">السيارات</a><a href="#publish">بيع سيارتك</a></nav><a class="nav-cta" href="#publish">+ أضف إعلانك</a></div></header>
<main class="wrap">
<div class="hero-card"><div class="hero-photo"></div><div class="hero-content"><div style="color:var(--gold2);font-size:13px;font-weight:800">وجهتك الأولى لعالم السيارات في ليبيا</div><h1>سيارتك القادمة<br><span>تبدأ من هنا.</span></h1><p>تصفح السيارات المعروضة في ليبيا وقارن الأسعار وتواصل مباشرة</p><div style="display:flex;gap:12px;margin-top:20px"><a class="nav-cta" href="#cars">اكتشف السيارات ←</a><a class="nav-cta" style="background:transparent;color:white;border:1px solid #fff5" href="#publish">اعرض سيارتك للبيع +</a></div></div></div>

<div class="search-panel">
<input class="control" id="searchInput" placeholder="ابحث: تويوتا كامري...">
<select class="control" id="cityFilter"><option value="">كل المدن</option><option>طرابلس</option><option>بنغازي</option><option>مصراتة</option><option>الزاوية</option><option>سبها</option></select>
<select class="control" id="customsFilter"><option value="">الجمارك</option><option>مجمركة</option><option>مش مجمركة</option><option>رسالة مفتوحة</option></select>
<select class="control" id="conditionFilter"><option value="">الحالة</option><option>مستعملة</option><option>جديدة</option><option>استيراد جديد</option></select>
<select class="control" id="sortFilter"><option value="newest">الأحدث</option><option value="featured">المميزة</option><option value="low">الأقل سعر</option><option value="high">الأعلى سعر</option></select>
</div>

<div id="resultsCount" style="color:#a6a6a6;margin-bottom:15px">جاري تحميل الإعلانات...</div>
<div class="cars-grid" id="cars"></div>

<section id="publish" style="margin-top:40px"><h2>أضف سيارتك للسوق</h2><form id="publishForm" style="background:#17191b;padding:20px;border-radius:20px;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px">
<input class="control" id="make" placeholder="الشركة: تويوتا" required><input class="control" id="model" placeholder="الموديل: كامري" required>
<input class="control" id="year" type="number" placeholder="السنة: 2020" required><input class="control" id="price" type="number" placeholder="السعر: 45000" required>
<select class="control" id="city" required><option value="">المدينة</option><option>طرابلس</option><option>بنغازي</option><option>مصراتة</option></select>
<input class="control" id="phone" placeholder="091XXXXXXXX" required>
<input class="control" type="file" id="photos" multiple accept="image/*" style="grid-column:1/-1">
<textarea class="control" id="description" placeholder="تفاصيل: كم ماشية، بنزين، أوتوماتيك..." rows="3" style="grid-column:1/-1"></textarea>
<button class="nav-cta" type="submit" style="grid-column:1/-1;min-height:50px">نشر إعلان السيارة</button>
</form></section>
</main>

<a class="whatsapp-float" href="https://wa.me/218914854102?text=السلام عليكم جاي من كار ليبيا" target="_blank">💬</a>

<script>
const SUPABASE_URL='https://vaafupmitnlffpqefmtl.supabase.co';
const SUPABASE_KEY='sb_publishable_Z002KdRZ5x4YpjvJnV5QnQ_MRuzG_eI';
const API_BASE=SUPABASE_URL+'/rest/v1';
const $=id=>document.getElementById(id);
let allCars=[]; 
function favs(){try{return JSON.parse(localStorage.getItem('carLibyaFavs')||'[]')}catch{return []}}
function toggleFav(id){let f=favs();id=String(id);if(f.includes(id))f=f.filter(x=>x!==id);else f.push(id);localStorage.setItem('carLibyaFavs',JSON.stringify(f));renderCars()}
async function api(p,o={}){const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,...(o.headers||{})};if(o.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(API_BASE+p,{...o,headers:h});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error((d&&d.message)||t);return d}
function imagesOf(c){const raw=c.image_url;if(!raw)return[];if(Array.isArray(raw))return raw;try{const j=JSON.parse(raw);if(Array.isArray(j))return j;if(typeof j==='string')return[j]}catch{}return String(raw).split(',').filter(Boolean)}
function renderCars(){const q=$('searchInput').value.toLowerCase();const city=$('cityFilter').value;let cars=allCars.filter(c=>[c.make,c.model,c.city].join(' ').toLowerCase().includes(q)&&(!city||c.city===city));$('resultsCount').textContent='عدد الإعلانات: '+cars.length;const box=$('cars');if(!cars.length){box.innerHTML='<div style=\"grid-column:1/-1;text-align:center;padding:40px;color:#888\">ما فيش سيارات</div>';return}box.innerHTML=cars.map(car=>{const imgs=imagesOf(car);const cover=imgs[0]||'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=600&q=80';const isFav=favs().includes(String(car.id));return `<article class=\"car-card ${car.description&&car.description.includes('مميز')?'featured':''}\"><div class=\"car-photo\"><img src=\"${cover}\" loading=\"lazy\"><span class=\"photo-count\">${imgs.length} صور</span><button class=\"fav-btn ${isFav?'active':''}\" onclick=\"toggleFav('${car.id}');event.stopPropagation()\">${isFav?'♥':'♡'}</button><span class=\"city-badge\">${car.city||'ليبيا'}</span></div><div class=\"car-body\"><h3>${car.make} ${car.model}</h3><div class=\"car-price\">${Number(car.price).toLocaleString('ar-LY')} <small>د.ل</small></div><div style=\"font-size:12px;color:#aaa\">${car.year||''} • ${car.city||''}</div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px\"><a href=\"https://wa.me/${car.phone?.replace(/^0/,'218')}?text=مهتم ب ${car.make}\" target=\"_blank\" style=\"background:#0c2618;color:#7bf0a6;padding:8px;text-align:center;border-radius:8px;font-size:12px\">واتساب</a><a href=\"tel:${car.phone}\" style=\"border:1px solid #ffffff20;color:#f4d58a;padding:8px;text-align:center;border-radius:8px;font-size:12px\">اتصال</a></div></div></article>`}).join('')}
async function loadCars(){try{const rows=await api('/cars?select=*&order=created_at.desc');allCars=Array.isArray(rows)?rows:[];renderCars()}catch(e){$('resultsCount').textContent='خطأ: '+e.message}}
$('searchInput').addEventListener('input',renderCars);$('cityFilter').addEventListener('change',renderCars);
$('publishForm').addEventListener('submit',async e=>{e.preventDefault();const token=Math.random().toString(36).slice(2);const payload={make:$('make').value,model:$('model').value,year:Number($('year').value),price:Number($('price').value),city:$('city').value,phone:$('phone').value,description:$('description').value,status:'available',image_url:JSON.stringify([])};try{await api('/cars',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});alert('تم النشر!');e.target.reset();loadCars()}catch(err){alert('خطأ: '+err.message)}});
loadCars();
</script>
</body>
</html>
