n><option value="featured">المميزة أولاً</option><option value="low">الأقل سعر</option></select></div><div id="resultsCount" style="color:#a6a6a6;margin-bottom:15px"></div><div class="cars-grid" id="cars"></div><section id="publish" style="margin-top:40px"><h2>أضف سيارتك</h2><form id="publishForm" style="background:#17191b;padding:20px;border-radius:20px;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px"><input class="control" id="make" placeholder="الشركة" required><input class="control" id="model" placeholder="الموديل" required><input class="control" id="year" type="number" placeholder="السنة" required><input class="control" id="price" type="number" placeholder="السعر" required><select class="control" id="city" required><option value="">المدينة</option><option>طرابلس</option><option>بنغازي</option><option>مصراتة</option></select><input class="control" id="phone" placeholder="091XXXXXXXX" required><select class="control" id="customs"><option>مجمركة</option><option>مش مجمركة</option><option>رسالة مفتوحة</option></select><select class="control" id="condition"><option>مستعملة</option><option>جديدة</option><option>استيراد جديد</option></select><input class="control" type="file" id="photos" multiple accept="image/*" style="grid-column:1/-1"><textarea class="control" id="description" placeholder="تفاصيل..." rows="3" style="grid-column:1/-1"></textarea><button class="nav-cta" type="submit" style="grid-column:1/-1;min-height:50px">نشر الإعلان</button></form></section></main><a class="whatsapp-float" href="https://wa.me/218914854102" target="_blank">💬</a><script>const SUPABASE_URL='https://vaafupmitnlffpqefmtl.supabase.co';const SUPABASE_KEY='sb_publishable_Z002KdRZ5x4YpjvJnV5QnQ_MRuzG_eI';const API_BASE=SUPABASE_URL+'/rest/v1';const $=id=>document.getElementById(id);let allCars=[];async function api(p,o={}){const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,...(o.headers||{})};if(o.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(API_BASE+p,{...o,headers:h});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error((d&&d.message)||t);return d}function imagesOf(c){const raw=c.image_url;if(!raw)return[];try{const j=JSON.parse(raw);if(Array.isArray(j))return j}catch{}return[]}function favs(){try{return JSON.parse(localStorage.getItem('carLibyaFavs')||'[]')}catch{return[]}}function toggleFav(id){let f=favs();id=String(id);if(f.includes(id))f=f.filter(x=>x!==id);else f.push(id);localStorage.setItem('carLibyaFavs',JSON.stringify(f));renderCars()}function renderCars(){const q=$('searchInput').value.toLowerCase();const city=$('cityFilter').value;const customs=$('customsFilter').value;const condition=$('conditionFilter').value;let cars=allCars.filter(c=>[c.make,c.model,c.city,c.description].join(' ').toLowerCase().includes(q)&&(!city||c.city===city)&&(!customs||(c.description||'').includes(customs))&&(!condition||(c.description||'').includes(condition)));$('resultsCount').textContent='عدد الإعلانات: '+cars.length;const box=$('cars');box.innerHTML=cars.map(car=>{const imgs=imagesOf(car);const cover=imgs[0]||'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=600&q=80';const isFav=favs().includes(String(car.id));return `<article class="car-card ${car.description&&car.description.includes('مميز')?'featured':''}"><div class="car-photo"><img src="${cover}"><span class="photo-count">${imgs.length} صور</span><button class="fav-btn ${isFav?'active':''}" onclick="toggleFav('${car.id}')">${isFav?'♥':'♡'}</button></div><div class="car-body"><h3>${car.make} ${car.model}</h3><div class="car-price">${Number(car.price).toLocaleString('ar-LY')} د.ل</div><div style="font-size:12px;color:#aaa">${car.year||''} • ${car.city||''}</div></div></article>`}).join('')}async function loadCars(){try{const rows=await api('/cars?select=*&order=created_at.desc');allCars=Array.isArray(rows)?rows:[];renderCars()}catch(e){$('resultsCount').textContent='خطأ: '+e.message}}$('searchInput').addEventListener('input',renderCars);$('cityFilter').addEventListener('change',renderCars);$('customsFilter').addEventListener('change',renderCars);$('conditionFilter').addEventListener('change',renderCars);loadCars();</script></body></html>
