<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAR LIBYA | سوق السيارات الليبي</title>
<style>
:root{--gold:#d4af37;--bg:#0f0f0f;--card:#1c1c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial, Tahoma}
header{background:#000;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:26px;color:var(--gold);letter-spacing:1px}
.btn{background:var(--gold);color:#000;border:0;padding:12px 20px;border-radius:10px;font-weight:900;cursor:pointer}
.hero{text-align:center;padding:25px 15px;background:linear-gradient(#1f1f1f,#0f0f0f)}
.filters{max-width:1200px;margin:12px auto;padding:12px;display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:12px;border:1px solid #333}
.filters input,.filters select{flex:1;min-width:140px;padding:11px;background:#2a2a2a;border:1px solid #555;color:#fff;border-radius:8px}
.grid{max-width:1200px;margin:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid #333;transition:.2s}
.card:hover{border-color:var(--gold)}
.card img{width:100%;height:185px;object-fit:cover;background:#222}
.card-body{padding:13px}
.price{color:var(--gold);font-weight:900;font-size:22px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;color:#bbb;font-size:13px}
.tag{background:#2a2a2a;padding:5px 10px;border-radius:20px}
.wa{display:flex;gap:8px;margin-top:12px}
.wa a{flex:1;text-align:center;padding:11px;border-radius:8px;text-decoration:none;font-weight:bold}
.wa1{background:#25D366;color:#fff}.wa2{background:#fff;color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:99;padding:12px}
.box{background:#1e1e1e;padding:22px;border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow:auto;border:1.5px solid var(--gold)}
.box input,.box select,.box textarea{width:100%;padding:11px;margin:6px 0 10px;background:#2a2a2a;border:1px solid #555;color:#fff;border-radius:8px}
#status{color:var(--gold);font-weight:bold;margin-top:8px}
#binInfo{font-size:11px;color:#777;word-break:break-all;margin-top:6px}
</style>
</head>
<body>
<header>
<div class="logo">CAR LIBYA</div>
<button class="btn" onclick="openAdd()">+ بيع سيارتك</button>
</header>

<div class="hero">
<h2 style="margin:0;color:var(--gold)">سوق السيارات الليبي الأول</h2>
<p style="margin:8px 0 0;color:#ccc">أعلن مجانا - الكل يشوف إعلانك</p>
<div id="status">جاري تحميل السيارات...</div>
<div id="binInfo"></div>
</div>

<div class="filters">
<input id="q" placeholder="ابحث Toyota, Kia..." oninput="render()">
<select id="fCity" onchange="render()"><option value="">كل المدن</option><option>طرابلس</option><option>بنغازي</option><option>مصراتة</option><option>الزاوية</option><option>الخمس</option><option>زليتن</option><option>سبها</option><option>اجدابيا</option><option>البيضاء</option><option>طبرق</option><option>غريان</option><option>صبراتة</option><option>زوارة</option><option>سرت</option></select>
<select id="fBrand" onchange="render()"><option value="">كل الماركات</option><option>Toyota</option><option>Hyundai</option><option>Kia</option><option>Mercedes</option><option>BMW</option><option>Honda</option><option>Nissan</option><option>Ford</option><option>Chevrolet</option></select>
</div>

<div id="cars" class="grid"></div>

<div id="modal" class="modal"><div class="box">
<h3 style="color:var(--gold);margin-top:0">أضف سيارتك - CAR LIBYA</h3>
<form id="form">
<input id="brand" placeholder="الماركة Toyota" required>
<input id="model" placeholder="الموديل Camry" required>
<div style="display:flex;gap:8px"><input id="year" type="number" placeholder="السنة 2020" required style="flex:1"><input id="km" type="number" placeholder="كم ماشية 50,000" required style="flex:1"></div>
<div style="display:flex;gap:8px"><select id="gear" required style="flex:1"><option value="">الكمبيو</option><option>توماتيك</option><option>عادي</option></select><select id="fuel" required style="flex:1"><option value="">الوقود</option><option>بنزين</option><option>نافطة</option><option>كهرباء</option></select></div>
<input id="price" type="number" placeholder="السعر بالدينار" required>
<select id="city" required><option value="">اختر المدينة</option><option>طرابلس</option><option>بنغازي</option><option>مصراتة</option><option>الزاوية</option><option>الخمس</option><option>زليتن</option><option>سبها</option><option>اجدابيا</option><option>البيضاء</option><option>طبرق</option><option>غريان</option></select>
<input id="phone" placeholder="رقم واتساب 2189XXXXXXX" required>
<textarea id="desc" placeholder="وصف السيارة، نظافة، حوادث..." rows="3"></textarea>
<input id="images" type="file" accept="image/*">
<button class="btn" style="width:100%;margin-top:6px" type="submit">نشر مجانا للعامة 🚀</button>
<button type="button" onclick="closeAdd()" style="width:100%;margin-top:8px;background:#333;color:#fff;border:0;padding:11px;border-radius:8px;cursor:pointer">إلغاء</button>
</form>
</div></div>

<script>
// الرابط العام - ينشئ نفسه تلقائيا أول مرة
let BIN_URL = localStorage.getItem('CARLIBYA_BIN_V2') || "";
let cars=[];

async function createBin(){
  let res = await fetch("https://api.npoint.io",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify([])});
  let data = await res.json();
  BIN_URL = "https://api.npoint.io/"+data.id;
  localStorage.setItem('CARLIBYA_BIN_V2',BIN_URL);
  return BIN_URL;
}

async function loadCars(){
  try{
    if(!BIN_URL){ BIN_URL = await createBin(); }
    let r = await fetch(BIN_URL);
    if(!r.ok) throw "error";
    cars = await r.json();
    if(!Array.isArray(cars)) cars=[];
    document.getElementById('status').innerText = `✅ CAR LIBYA شغال للعامة - ${cars.length} سيارة`;
    document.getElementById('binInfo').innerText = "رابط قاعدتك: "+BIN_URL+" - ثبته في الكود بعدين";
    render();
  }catch(e){
    try{ BIN_URL = await createBin(); loadCars(); }
    catch(err){ document.getElementById('status').innerText = "افتح npoint.io وانشئ bin فيه []"; }
  }
}

function openAdd(){document.getElementById('modal').style.display='grid'}
function closeAdd(){document.getElementById('modal').style.display='none'}

function render(){
  let q=document.getElementById('q').value.toLowerCase();
  let city=document.getElementById('fCity').value;
  let brand=document.getElementById('fBrand').value;
  let f=cars.filter(c=>{
    return (c.brand+' '+c.model).toLowerCase().includes(q) && (!city||c.city===city) && (!brand||c.brand===brand)
  });
  document.getElementById('cars').innerHTML = f.map(c=>`
  <div class="card">
    <img src="${c.img||'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600'}">
    <div class="card-body">
      <div class="price">${Number(c.price).toLocaleString()} د.ل</div>
      <b>${c.brand} ${c.model} ${c.year||''}</b>
      <div class="meta"><span class="tag">📍 ${c.city}</span><span class="tag">🛣️ ${c.km||0} KM</span><span class="tag">${c.gear||''}</span></div>
      <div style="font-size:13px;color:#ccc;margin-top:4px">${(c.desc||'').slice(0,80)}</div>
      <div class="wa"><a class="wa1" href="https://wa.me/${c.phone}?text=مرحبا بخصوص ${c.brand} ${c.model} في CAR LIBYA" target="_blank">واتساب</a><a class="wa2" href="tel:${c.phone}">اتصال</a></div>
    </div>
  </div>`).join('') || '<p style="text-align:center;padding:50px;color:#777">لا توجد سيارات، كن أول من يعلن!</p>';
}

document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();
  let img=''; if(images.files[0]) img=await new Promise(r=>{let fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(images.files[0])});
  let data={brand:brand.value,model:model.value,year:year.value,km:km.value,gear:gear.value,fuel:fuel.value,price:price.value,city:city.value,phone:phone.value,desc:desc.value,img,time:Date.now()};
  cars.unshift(data);
  document.getElementById('status').innerText="جاري النشر للعامة...";
  await fetch(BIN_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cars)});
  closeAdd(); e.target.reset(); render();
  document.getElementById('status').innerText=`تم النشر! عندنا ${cars.length} سيارة`;
});

loadCars();
</script>
</body>
</html>
