<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<meta name="description" content="CAR LIBYA - منصتك لبيع وشراء السيارات في ليبيا">
<title>CAR LIBYA | سوق السيارات الليبي</title>

<style>
:root{
  --bg:#080b12;
  --panel:#111722;
  --panel2:#171f2d;
  --gold:#e9b949;
  --gold2:#ffd978;
  --blue:#2589ff;
  --text:#f5f7fb;
  --muted:#9ba7ba;
  --border:rgba(255,255,255,.09);
  --green:#20c878;
  --red:#ff5267;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 85% 0%,rgba(37,137,255,.10),transparent 35%),
    radial-gradient(ellipse at 10% 15%,rgba(233,185,73,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  line-height:1.8;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,18,.93);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.nav{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:linear-gradient(145deg,#ffe29a,#bd8720);
  box-shadow:0 5px 25px rgba(233,185,73,.2);
}

.logo svg{
  width:42px;
  height:32px;
}

.brand-name{
  direction:ltr;
  text-align:left;
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
  line-height:1.2;
}

.brand-name span{
  color:var(--gold);
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.nav-actions{
  display:flex;
  gap:9px;
  align-items:center;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.btn-gold{
  background:linear-gradient(135deg,var(--gold2),#c58b20);
  color:#17120a;
  box-shadow:0 5px 20px rgba(233,185,73,.13);
}

.btn-blue{
  background:linear-gradient(135deg,#329cff,#1460d3);
  color:white;
}

.btn-dark{
  background:#202a39;
  color:white;
  border:1px solid var(--border);
}

.btn-green{
  background:#0c9e61;
  color:white;
}

.btn-red{
  background:#722532;
  color:#ffdce1;
}

.btn-small{
  padding:8px 11px;
  font-size:12px;
}

/* HERO */

.hero{
  padding:48px 0 30px;
}

.hero-box{
  min-height:350px;
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:25px;
  padding:40px;
  border-radius:28px;
  border:1px solid rgba(233,185,73,.22);
  background:
    radial-gradient(ellipse at 75% 50%,rgba(37,137,255,.19),transparent 45%),
    linear-gradient(120deg,#151d2a,#0e131d 65%,#181710);
}

.hero-box:after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border:1px solid rgba(233,185,73,.12);
  border-radius:50%;
  right:-120px;
  top:-170px;
  box-shadow:0 0 0 35px rgba(233,185,73,.025),
             0 0 0 70px rgba(233,185,73,.02);
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(233,185,73,.25);
  background:rgba(233,185,73,.08);
  color:var(--gold2);
  border-radius:50px;
  padding:6px 13px;
  font-size:12px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(30px,5vw,52px);
  line-height:1.35;
  margin-bottom:14px;
  font-weight:900;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  color:#b9c3d2;
  max-width:500px;
  font-size:15px;
  margin-bottom:23px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.hero-art{
  position:relative;
  z-index:1;
  min-width:0;
}

.hero-art svg{
  display:block;
  width:100%;
  max-width:490px;
  margin:auto;
  filter:drop-shadow(0 20px 25px rgba(0,0,0,.45));
}

.hero-stats{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin-top:26px;
}

.stat{
  display:flex;
  align-items:center;
  gap:9px;
}

.stat-icon{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  background:#202a39;
  border-radius:10px;
}

.stat strong{
  display:block;
  font-size:14px;
}

.stat small{
  color:var(--muted);
  font-size:11px;
}

/* SECTION */

.section{
  padding:26px 0;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:20px;
}

.section-heading h2{
  font-size:25px;
  font-weight:900;
}

.section-heading h2 span{
  color:var(--gold);
}

.section-heading p{
  color:var(--muted);
  font-size:13px;
}

.count-badge{
  background:rgba(233,185,73,.12);
  border:1px solid rgba(233,185,73,.22);
  color:var(--gold2);
  padding:7px 14px;
  border-radius:50px;
  font-size:12px;
}

/* SEARCH */

.search-panel{
  background:linear-gradient(145deg,#141c29,#10151f);
  border:1px solid var(--border);
  padding:20px;
  border-radius:20px;
  margin-bottom:22px;
}

.search-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  color:#c7d0de;
  font-size:12px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  min-width:0;
  padding:12px 13px;
  border-radius:11px;
  border:1px solid #2b3647;
  background:#0b111b;
  color:white;
  outline:none;
  transition:.2s;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(233,185,73,.08);
}

input::placeholder,textarea::placeholder{
  color:#738096;
}

select option{
  background:#111722;
  color:white;
}

.search-button{
  align-self:end;
  min-height:46px;
}

/* CARDS */

.cars-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:19px;
}

.car-card{
  min-width:0;
  overflow:hidden;
  background:linear-gradient(145deg,#151d2a,#0f141e);
  border:1px solid var(--border);
  border-radius:19px;
  transition:.25s;
}

.car-card:hover{
  transform:translateY(-5px);
  border-color:rgba(233,185,73,.45);
  box-shadow:0 18px 45px rgba(0,0,0,.23);
}

.car-image{
  position:relative;
  height:210px;
  background:
    radial-gradient(ellipse at center,rgba(37,137,255,.15),transparent 70%),
    #111927;
  overflow:hidden;
}

.car-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  color:#7f8ba0;
}

.image-placeholder svg{
  width:105px;
  opacity:.7;
}

.image-placeholder span{
  font-size:11px;
}

.car-badge{
  position:absolute;
  top:12px;
  right:12px;
  border-radius:8px;
  padding:5px 10px;
  font-size:11px;
  font-weight:bold;
  background:rgba(8,11,18,.85);
  border:1px solid rgba(255,255,255,.13);
}

.badge-available{
  color:#60e9a3;
}

.badge-sold{
  color:#ff8190;
}

.car-body{
  padding:17px;
}

.car-title{
  font-size:19px;
  font-weight:900;
  margin-bottom:8px;
  overflow-wrap:anywhere;
}

.car-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:13px;
}

.meta-item{
  background:#202938;
  color:#c2ccda;
  padding:5px 9px;
  border-radius:8px;
  font-size:11px;
}

.car-price{
  color:var(--gold2);
  font-size:24px;
  font-weight:900;
  margin:12px 0;
  direction:rtl;
}

.car-price small{
  font-size:12px;
  font-weight:normal;
  color:#b4bdca;
}

.car-description{
  color:#9eabba;
  font-size:12px;
  line-height:1.9;
  margin-bottom:14px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.car-phone{
  color:#bfc9d7;
  font-size:12px;
  margin-bottom:13px;
  direction:ltr;
  text-align:right;
}

.car-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  border-top:1px solid var(--border);
  padding-top:13px;
}

.car-actions .btn{
  flex:1 1 auto;
}

.empty-state{
  text-align:center;
  border:1px dashed #354052;
  border-radius:20px;
  padding:45px 20px;
  color:var(--muted);
  grid-column:1/-1;
}

.empty-icon{
  font-size:43px;
  margin-bottom:8px;
}

.empty-state h3{
  color:white;
  margin-bottom:5px;
}

/* ADD FORM */

.add-section{
  padding:35px 0 50px;
}

.form-panel{
  background:
    radial-gradient(ellipse at 100% 0%,rgba(233,185,73,.08),transparent 35%),
    linear-gradient(145deg,#151d2a,#0f141e);
  border:1px solid rgba(233,185,73,.19);
  border-radius:23px;
  padding:25px;
}

.form-title{
  margin-bottom:20px;
}

.form-title h2{
  font-size:25px;
}

.form-title p{
  font-size:13px;
  color:var(--muted);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:17px;
}

.full{
  grid-column:1/-1;
}

textarea{
  resize:vertical;
  min-height:105px;
}

.file-note{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.form-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.notice{
  margin-top:15px;
  padding:12px;
  border-radius:11px;
  background:rgba(37,137,255,.08);
  border:1px solid rgba(37,137,255,.2);
  color:#a9cfff;
  font-size:12px;
  line-height:1.9;
}

/* FOOTER */

footer{
  border-top:1px solid var(--border);
  padding:25px 0;
  background:#080b12;
}

.footer-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:15px;
}

.footer-inner p{
  color:var(--muted);
  font-size:12px;
}

.footer-inner strong{
  direction:ltr;
  color:var(--gold);
  font-size:17px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,120px);
  z-index:500;
  background:#1c2838;
  color:white;
  border:1px solid rgba(233,185,73,.35);
  padding:13px 20px;
  border-radius:13px;
  box-shadow:0 10px 35px #0008;
  width:max-content;
  max-width:90%;
  font-size:13px;
  transition:.3s;
  opacity:0;
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

[hidden]{
  display:none!important;
}

/* RESPONSIVE */

@media(max-width:900px){
  .hero-box{
    grid-template-columns:1fr;
    padding:30px;
  }

  .hero-art{
    max-width:500px;
    width:100%;
    margin:auto;
  }

  .hero-art svg{
    max-height:230px;
  }

  .cars-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .search-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:560px){
  .container{
    width:94%;
  }

  .nav{
    min-height:68px;
  }

  .logo{
    width:43px;
    height:43px;
  }

  .brand-name{
    font-size:17px;
  }

  .brand small{
    font-size:9px;
  }

  .nav-actions .btn{
    padding:9px 11px;
    font-size:11px;
  }

  .hero{
    padding-top:20px;
  }

  .hero-box{
    padding:23px 18px;
    border-radius:21px;
    gap:12px;
  }

  .hero h1{
    font-size:31px;
  }

  .hero p{
    font-size:13px;
  }

  .hero-stats{
    gap:13px;
  }

  .stat{
    gap:6px;
  }

  .stat-icon{
    width:30px;
    height:30px;
  }

  .stat strong{
    font-size:12px;
  }

  .section-heading h2{
    font-size:21px;
  }

  .search-panel{
    padding:13px;
  }

  .search-grid{
    grid-template-columns:1fr;
  }

  .cars-grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .car-image{
    height:225px;
  }

  .form-panel{
    padding:17px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .footer-inner{
    justify-content:center;
    text-align:center;
  }
}
</style>
</head>

<main>

          <div class="hero-stats">

            <div class="stat">
              <div class="stat-icon">💬</div>
              <div>
                <strong>تواصل مباشر</strong>

              </div>
            </div>
          </div>
        </div>

        <!-- رسم سيارة رياضية داخل الموقع -->

               role="img" aria-label="سيارة رياضية">

            <defs>
              <linearGradient id="bodyPaint" x1="0" y1="0" x2="0.8" y2="1">
                <stop offset="0" stop-color="#65baff"/>
                <stop offset=".35" stop-color="#247fe5"/>
                <stop offset=".75" stop-color="#
