name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

### بعد ما تلصق الكود

1. اضغط **Commit changes**.
2. لو ظهرت نافذة ثانية، اضغط **Commit changes** مرة أخرى.
3. ارجع إلى **Actions** وافتح أحدث عملية نشر.

**ملاحظة:** لو ما زالت عملية النشر تفشل، ابعثلي رسالة الخطأ الجديدة. بنصلحها حسب السبب بدل ما نغيّر ملفات أخرى عشوائيًا.
